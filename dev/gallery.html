<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galleria arte - Carlotta's Gift Run</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #cfe9ff; color: #2a1245; }
      h1 { margin: 12px 16px 0; font-size: 20px; }
      h2 { margin: 18px 16px 6px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
      .grid { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 16px; align-items: flex-end; }
      figure { margin: 0; text-align: center; font-size: 11px; }
      figure img { display: block; background: repeating-conic-gradient(#fff 0 25%, #e6eefc 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
      .dark img { background: #3a2a7a; }
      .row { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 16px; }
    </style>
  </head>
  <body>
    <h1>Galleria dell'arte procedurale</h1>
    <div id="root"></div>
    <script type="module" src="./gallery.js"></script>
  </body>
</html>
