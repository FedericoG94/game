<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Il gioco ha sempre i suoi colori: niente tema scuro forzato dal browser o dal dispositivo. -->
    <meta name="color-scheme" content="only light" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>&nbsp;</title>
    <style id="gate-style">
      :root { color-scheme: only light; }
      html, body { margin: 0; height: 100%; background: #000; }
      #gate { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 99999; }
      #gate-input { width: min(70vw, 260px); height: 44px; padding: 0 12px; box-sizing: border-box; background: #000; color: #fff; border: 1px solid #333; border-radius: 6px; font: 18px sans-serif; text-align: center; outline: none; }
      #gate-input:focus { border-color: #555; }
      #gate-input.no { animation: no 0.3s; }
      @keyframes no { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game" aria-hidden="true"></div>
      <div id="ui" aria-live="off"></div>
    </div>
    <form id="gate" autocomplete="off"><input id="gate-input" type="password" autocomplete="off" aria-label="Password" /></form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
